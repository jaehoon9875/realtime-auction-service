# App of Apps: infra/argocd/apps/ 하위 Application CR 일괄 등록
# 적용 순서: project.yaml → bootstrap.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auction-bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: auction-project
  source:
    repoURL: https://github.com/jaehoon9875/realtime-auction-service
    # TODO: main 브랜치로 변경. 현재는 임시로 feature/m8-gke-deployment 브랜치로 설정.
    targetRevision: feature/m8-gke-deployment
    path: infra/argocd/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
