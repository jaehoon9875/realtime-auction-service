# App of Apps: infra/argocd/apps/ 하위 Application CR 일괄 등록
# 초기 부트스트랩 절차: docs/gke-deployment.md 10절 참고
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auction-bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: auction-project
  source:
    repoURL: https://github.com/jaehoon9875/realtime-auction-service
    targetRevision: main
    path: infra/argocd/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
