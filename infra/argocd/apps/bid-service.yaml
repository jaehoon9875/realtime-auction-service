apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bid-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: auction-project
  source:
    repoURL: https://github.com/jaehoon9875/realtime-auction-service
    targetRevision: main
    path: infra/k8s/overlays/dev/bid-service
  destination:
    server: https://kubernetes.default.svc
    namespace: auction
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.data[].remoteRef.nullBytePolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
