apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-sa
  namespace: argocd
  annotations:
    # ExternalSecrets config(wave 1)보다 먼저 SA annotation이 적용되어야 함
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: auction-project
  source:
    repoURL: https://github.com/jaehoon9875/realtime-auction-service
    targetRevision: main
    path: infra/k8s/base/external-secrets-sa
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
