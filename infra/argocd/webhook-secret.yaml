# GitHub webhook secret을 argocd-secret에 병합한다.
# ArgoCD는 argocd-secret의 webhook.github.secret 키를 읽어 webhook 요청을 검증한다.
# creationPolicy: Merge — ESO가 기존 argocd-secret을 덮어쓰지 않고 해당 키만 추가한다.
#
# 사전 조건:
#   gcloud secrets create argocd-webhook-github-secret --data-file=-
# 적용:
#   kubectl apply -f infra/argocd/webhook-secret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-webhook-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: webhook.github.secret
      remoteRef:
        key: argocd-webhook-github-secret
