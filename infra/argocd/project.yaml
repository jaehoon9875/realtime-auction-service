# AppProject: auction 네임스페이스 GitOps 범위 정의
# 초기 부트스트랩 절차: docs/gke-deployment.md 10절 참고
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: auction-project
  namespace: argocd
spec:
  description: realtime-auction-service dev 환경
  sourceRepos:
    - https://github.com/jaehoon9875/realtime-auction-service
  destinations:
    - namespace: auction
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: external-secrets-system
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    # Core API
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    # Workloads
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
    # Namespace RBAC
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    # External Secrets
    - group: external-secrets.io
      kind: ExternalSecret
    # Sealed Secrets
    - group: bitnami.com
      kind: SealedSecret
    # Prometheus Operator 모니터링 리소스
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    # Strimzi Kafka (네임스페이스 스코프)
    - group: kafka.strimzi.io
      kind: Kafka
    - group: kafka.strimzi.io
      kind: KafkaNodePool
    - group: kafka.strimzi.io
      kind: KafkaTopic
    # ArgoCD Application (argocd 네임스페이스 destination용)
    - group: argoproj.io
      kind: Application
  clusterResourceWhitelist:
    # Namespace는 클러스터 스코프 리소스이지만 각 앱 overlay가 공통 namespace를 포함한다.
    - group: ""
      kind: "Namespace"
    - group: "external-secrets.io"
      kind: "ClusterSecretStore"
