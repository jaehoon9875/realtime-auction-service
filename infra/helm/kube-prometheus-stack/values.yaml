# prometheus-community/kube-prometheus-stack 커스텀 설정
# chart version: 85.3.0 / app version: v0.90.1
# release name: kube-prometheus-stack

prometheus:
  prometheusSpec:
    # Exemplar 저장소 활성화 — 메트릭에 붙은 trace_id를 Prometheus가 보존 (Tempo 연동 시 활용)
    enableFeatures:
      - exemplar-storage

grafana:
  # admin 비밀번호는 SealedSecret(grafana-admin-secret)으로 관리
  # 비밀번호 변경 시 docs/sealed-secrets-setup.md 참조
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    datasources:
      # kube-prometheus-stack이 자동 생성하는 Prometheus 데이터소스에
      # Exemplar → Tempo 링크 설정 추가
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
  deleteDatasources:
    - name: Loki
      orgId: 1
    - name: Tempo
      orgId: 1
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki-gateway.monitoring.svc.cluster.local
      access: proxy
      jsonData:
        httpHeaderName1: "X-Scope-OrgID"
        # Alloy가 structured_metadata에 저장한 trace_id를 직접 참조하여 Tempo 트레이스 링크로 연결
        # matcherType: label은 Grafana 11.x + Loki 3.x에서 structured_metadata 필드도 읽음
        derivedFields:
          - name: TraceID
            matcherType: label
            matcherName: trace_id
            url: "${__value.raw}"
            datasourceUid: tempo
            urlDisplayLabel: "View trace in Tempo"
      secureJsonData:
        httpHeaderValue1: "fake"
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.monitoring:3200
      access: proxy
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-2s"
          spanEndTimeShift: "2s"
          filterByTraceID: true
          filterBySpanID: false
          tags:
            # OTel resource attribute service.name → Loki label app으로 매핑
            - key: service.name
              value: app
        lokiSearch:
          datasourceUid: loki
