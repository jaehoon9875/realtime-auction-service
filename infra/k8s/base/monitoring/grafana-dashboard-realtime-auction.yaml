apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-realtime-auction
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Realtime Auction"
data:
  realtime-auction-ops.json: |
    {
      "title": "Realtime Auction — 운영 현황",
      "uid": "realtime-auction-ops",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-30m", "to": "now" },
      "timezone": "browser",
      "tags": ["auction", "kafka", "jvm"],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(kube_pod_info, namespace)",
            "refresh": 2,
            "current": { "text": "auction", "value": "auction" },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "Kafka Consumer Lag",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 1 },
          "collapsed": false
        },
        {
          "id": 1,
          "type": "timeseries",
          "title": "토픽별 Consumer Lag",
          "description": "컨슈머 그룹별 토픽 lag 추이. 부하 구간에서도 0 근처 유지 여부 확인",
          "gridPos": { "x": 0, "y": 1, "w": 16, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "kafka_consumergroup_lag_sum{namespace=\"$namespace\"}",
              "legendFormat": "{{consumergroup}} / {{topic}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 10 },
                  { "color": "red", "value": 100 }
                ]
              },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "gradientMode": "none",
                "showPoints": "never",
                "spanNulls": false
              },
              "color": { "mode": "palette-classic" }
            }
          },
          "options": {
            "tooltip": { "mode": "multi", "sort": "none" },
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["last", "max"],
              "showLegend": true
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "최고 Lag",
          "gridPos": { "x": 16, "y": 1, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "max(kafka_consumergroup_lag_sum{namespace=\"$namespace\"}) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 10 },
                  { "color": "red", "value": 100 }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "center"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Lag 상태",
          "description": "최고 lag 값 기준 정상/주의/경고 판정",
          "gridPos": { "x": 16, "y": 5, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "max(kafka_consumergroup_lag_sum{namespace=\"$namespace\"}) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 10 },
                  { "color": "red", "value": 100 }
                ]
              },
              "mappings": [
                {
                  "type": "range",
                  "options": {
                    "from": 0,
                    "to": 9,
                    "result": { "text": "정상", "index": 0 }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 10,
                    "to": 99,
                    "result": { "text": "주의", "index": 1 }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 100,
                    "to": 9999999,
                    "result": { "text": "경고", "index": 2 }
                  }
                }
              ]
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "모니터링 중인 Consumer Group",
          "gridPos": { "x": 20, "y": 1, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "count(count by (consumergroup) (kafka_consumergroup_lag_sum{namespace=\"$namespace\"})) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "blue", "value": null }]
              }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Lag = 0 Group 수",
          "description": "lag이 0으로 완전히 소비된 consumer group 수",
          "gridPos": { "x": 20, "y": 5, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "count(kafka_consumergroup_lag_sum{namespace=\"$namespace\"} == 0) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 200,
          "type": "row",
          "title": "서비스 처리량",
          "gridPos": { "x": 0, "y": 9, "w": 24, "h": 1 },
          "collapsed": false
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "HTTP 처리량 (req/s)",
          "description": "서비스별 초당 HTTP 요청 처리량. k6 VU 50 steady state 구간 기준 bid-service 중심으로 확인",
          "gridPos": { "x": 0, "y": 10, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"$namespace\"}[1m])) by (app)",
              "legendFormat": "{{app}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 5,
                "showPoints": "never",
                "spanNulls": false
              },
              "color": { "mode": "palette-classic" }
            }
          },
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["last", "max"],
              "showLegend": true
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "HTTP 레이턴시 p95 / p99 (ms)",
          "description": "서비스별 레이턴시 p95/p99. 병렬화 개선(After 37ef9eb) 구간 p95 -59% 확인 가능",
          "gridPos": { "x": 12, "y": 10, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{namespace=\"$namespace\"}[1m])) by (app, le)) * 1000",
              "legendFormat": "p95 {{app}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{namespace=\"$namespace\"}[1m])) by (app, le)) * 1000",
              "legendFormat": "p99 {{app}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 3,
                "showPoints": "never",
                "spanNulls": false
              },
              "color": { "mode": "palette-classic" }
            }
          },
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["last", "max"],
              "showLegend": true
            }
          }
        },
        {
          "id": 300,
          "type": "row",
          "title": "JVM 상태",
          "gridPos": { "x": 0, "y": 18, "w": 24, "h": 1 },
          "collapsed": false
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "JVM Heap 사용량",
          "description": "서비스별 JVM heap 메모리 사용량",
          "gridPos": { "x": 0, "y": 19, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(jvm_memory_used_bytes{namespace=\"$namespace\", area=\"heap\"}) by (app)",
              "legendFormat": "{{app}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              },
              "color": { "mode": "palette-classic" }
            }
          },
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["last", "max"],
              "showLegend": true
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "GC 빈도 (회/s)",
          "description": "서비스별 GC 발생 빈도. 부하 구간에서 급증 여부 확인",
          "gridPos": { "x": 12, "y": 19, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(jvm_gc_pause_seconds_count{namespace=\"$namespace\"}[1m])) by (app)",
              "legendFormat": "{{app}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 5,
                "showPoints": "never",
                "spanNulls": false
              },
              "color": { "mode": "palette-classic" }
            }
          },
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["last", "max"],
              "showLegend": true
            }
          }
        }
      ]
    }
