apiVersion: v1
kind: ConfigMap
metadata:
  name: auction-service-configmap
  namespace: auction
data:
  AUCTION_SERVICE_PORT: "PLACEHOLDER"
  # Cloud SQL Auth Proxy 사이드카가 localhost:5432 로 Cloud SQL을 프록시한다
  POSTGRES_HOST: PLACEHOLDER
  POSTGRES_AUCTION_PORT: "PLACEHOLDER"
  POSTGRES_AUCTION_DB_NAME: PLACEHOLDER
  POSTGRES_USER: PLACEHOLDER
  # 형식: project:region:instance (Cloud SQL Auth Proxy)
  CLOUD_SQL_CONNECTION_NAME: PLACEHOLDER
  JWK_SET_URI: PLACEHOLDER
  SWAGGER_ENABLED: "PLACEHOLDER"
  AUCTION_STREAMS_BASE_URL: PLACEHOLDER
  AUCTION_STREAMS_CONNECT_TIMEOUT: "PLACEHOLDER"
  AUCTION_STREAMS_READ_TIMEOUT: "PLACEHOLDER"
  AUCTION_SCHEDULE_ENABLED: "PLACEHOLDER"
  AUCTION_PENDING_TO_ONGOING_MS: "PLACEHOLDER"
  AUCTION_ONGOING_TO_CLOSED_MS: "PLACEHOLDER"
  SCHEMA_REGISTRY_URL: PLACEHOLDER
