apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service-deployment
  namespace: auction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/component: websocket
        app.kubernetes.io/part-of: realtime-auction-service
    spec:
      serviceAccountName: notification-service-serviceaccount
      tolerations:
        - key: "spot"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      containers:
        - name: notification-service
          image: notification-service
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: notification-service-configmap
          env:
            # REDIS_HOST 는 Memorystore private IP — GCP Secret Manager 에서 주입
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: notification-service-secret
                  key: REDIS_HOST
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
