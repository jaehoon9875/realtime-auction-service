apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-configmap
  namespace: auction
data:
  SERVER_PORT: "PLACEHOLDER"
  # REDIS_HOST 는 ExternalSecret 으로 주입 (GCP Secret Manager: redis-host)
  REDIS_PORT: "PLACEHOLDER"
  KAFKA_BOOTSTRAP_SERVERS: PLACEHOLDER
  SCHEMA_REGISTRY_URL: PLACEHOLDER
  JWK_SET_URI: PLACEHOLDER
  KAFKA_NOTIFICATION_EVENTS_TOPIC: PLACEHOLDER
  # OTel 분산 추적 — Tempo OTLP HTTP 엔드포인트 (#49, #50)
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo.monitoring:4318/v1/traces
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
