apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: notification-service-externalsecret
  namespace: auction
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: notification-service-secret
  data:
    # Memorystore private IP — Cloud SQL Auth Proxy 가 없어 직접 주입
    - secretKey: REDIS_HOST
      remoteRef:
        key: redis-host
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: redis-password
