apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-service-externalsecret
  namespace: auction
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: user-service-secret
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: user-db-password
    # Memorystore private IP — Cloud SQL Auth Proxy 가 없어 직접 주입
    - secretKey: REDIS_HOST
      remoteRef:
        key: redis-host
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: redis-password
    - secretKey: JWT_PRIVATE_KEY
      remoteRef:
        key: jwt-private-key
    - secretKey: JWT_PUBLIC_KEY
      remoteRef:
        key: jwt-public-key
