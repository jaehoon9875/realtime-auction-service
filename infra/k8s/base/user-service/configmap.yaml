apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-configmap
  namespace: auction
data:
  USER_SERVICE_PORT: "PLACEHOLDER"
  # Cloud SQL Auth Proxy 사이드카가 localhost:5432 로 Cloud SQL을 프록시한다
  POSTGRES_HOST: PLACEHOLDER
  POSTGRES_USER_PORT: "PLACEHOLDER"
  POSTGRES_USER_DB_NAME: PLACEHOLDER
  POSTGRES_USER: PLACEHOLDER
  # 형식: project:region:instance (Cloud SQL Auth Proxy)
  CLOUD_SQL_CONNECTION_NAME: PLACEHOLDER
  # REDIS_HOST 는 ExternalSecret 으로 주입 (GCP Secret Manager: redis-host)
  REDIS_PORT: "PLACEHOLDER"
  SWAGGER_ENABLED: "PLACEHOLDER"
  JWT_ACCESS_TOKEN_EXPIRATION_MS: "PLACEHOLDER"
  JWT_REFRESH_TOKEN_EXPIRATION_MS: "PLACEHOLDER"
  # OTel 분산 추적 — Tempo OTLP HTTP 엔드포인트 (#49, #50)
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo.monitoring:4318/v1/traces
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
