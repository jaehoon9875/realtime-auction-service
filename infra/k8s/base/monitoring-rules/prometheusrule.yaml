apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: slo-supplement-rules
  namespace: monitoring
  labels:
    # kube-prometheus-stack의 ruleSelector가 이 라벨을 기준으로 PrometheusRule을 수집함
    release: kube-prometheus-stack
spec:
  groups:
    - name: pod-restart
      rules:
        - alert: PodRestartCountHigh
          # 1시간 내 재시작 5회 초과 → OOM Kill, CrashLoopBackOff 탐지
          expr: increase(kube_pod_container_status_restarts_total[1h]) > 5
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} 재시작 횟수 초과"
            description: >-
              {{ $labels.namespace }}/{{ $labels.pod }} 컨테이너 {{ $labels.container }}이(가)
              1시간 내 {{ $value | printf "%.0f" }}회 재시작됨

    - name: scrape-availability
      rules:
        - alert: PrometheusTargetDown
          # scrape 실패 시 에러율·레이턴시 지표도 소실되므로 최우선 탐지
          expr: up == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Prometheus scrape 대상 다운: {{ $labels.job }}"
            description: >-
              {{ $labels.namespace }}/{{ $labels.job }} scrape 5분 이상 실패
              (instance: {{ $labels.instance }})
