apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-configmap
  namespace: auction
data:
  # Confluent cp-kafka-connect 이미지는 모든 설정에 CONNECT_ 접두사가 필요하다
  CONNECT_BOOTSTRAP_SERVERS: PLACEHOLDER
  CONNECT_GROUP_ID: PLACEHOLDER
  CONNECT_CONFIG_STORAGE_TOPIC: PLACEHOLDER
  CONNECT_OFFSET_STORAGE_TOPIC: PLACEHOLDER
  CONNECT_STATUS_STORAGE_TOPIC: PLACEHOLDER
  CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "PLACEHOLDER"
  CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "PLACEHOLDER"
  CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "PLACEHOLDER"
  CONNECT_REST_PORT: "PLACEHOLDER"
  CONNECT_KEY_CONVERTER: PLACEHOLDER
  # Kafka Connect용 Avro Converter 클래스명: io.confluent.connect.avro.AvroConverter
  CONNECT_VALUE_CONVERTER: PLACEHOLDER
  CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "PLACEHOLDER"
  CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: PLACEHOLDER
  CONNECT_PLUGIN_DISCOVERY: PLACEHOLDER
  # 각 DB 에 대한 Cloud SQL Auth Proxy 연결 이름
  # auction-db 프록시: localhost:5432, bid-db 프록시: localhost:5433
  AUCTION_CLOUD_SQL_CONNECTION_NAME: PLACEHOLDER
  BID_CLOUD_SQL_CONNECTION_NAME: PLACEHOLDER
