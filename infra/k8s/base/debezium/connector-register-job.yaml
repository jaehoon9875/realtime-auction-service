apiVersion: batch/v1
kind: Job
metadata:
  name: debezium-connector-register-job
  namespace: auction
  annotations:
    # ArgoCD hook: 앱 Sync 완료 후 1회 실행
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600  # backoffLimit 재시도 포함 전체 상한 — Debezium 장애 시 ArgoCD sync 무한 대기 방지
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register-connectors
          image: curlimages/curl:8.7.1
          env:
            - name: DEBEZIUM_URL
              value: http://debezium-service:8083
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: debezium-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: debezium-secret
                  key: POSTGRES_PASSWORD
            - name: AUCTION_POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: debezium-connector-configmap
                  key: AUCTION_POSTGRES_HOST
            - name: AUCTION_POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: debezium-connector-configmap
                  key: AUCTION_POSTGRES_PORT
            - name: AUCTION_POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: debezium-connector-configmap
                  key: AUCTION_POSTGRES_DB
            - name: BID_POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: debezium-connector-configmap
                  key: BID_POSTGRES_HOST
            - name: BID_POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: debezium-connector-configmap
                  key: BID_POSTGRES_PORT
            - name: BID_POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: debezium-connector-configmap
                  key: BID_POSTGRES_DB
          command:
            - /bin/sh
            - -c
            - |
              set -e

              # deployment.yaml readinessProbe가 /connectors를 체크하므로
              # ArgoCD는 Debezium Deployment가 Healthy 상태일 때만 PostSync Job을 실행한다.
              # 이 시점에 REST API는 이미 응답 가능 → 별도 대기 루프 불필요.
              # 일시적 장애는 backoffLimit(5회 재시도), 전체 상한은 activeDeadlineSeconds로 처리.

              wait_for_connector_running() {
                connector_name="$1"
                for i in $(seq 1 60); do
                  status_json="$(curl -sf "${DEBEZIUM_URL}/connectors/${connector_name}/status")"

                  if echo "${status_json}" | grep -q '"state":"FAILED"'; then
                    echo "${connector_name} has failed task. restarting failed tasks..."
                    curl -sf -X POST "${DEBEZIUM_URL}/connectors/${connector_name}/restart?includeTasks=true&onlyFailed=true" >/dev/null
                  elif echo "${status_json}" | grep -q '"connector":{"state":"RUNNING"' \
                    && echo "${status_json}" | grep -q '"tasks":\[{"id":0,"state":"RUNNING"'; then
                    echo "${connector_name} is RUNNING."
                    return 0
                  fi

                  echo "${connector_name} RUNNING 대기 ${i}/60"
                  sleep 5
                done

                echo "${connector_name}가 RUNNING 상태가 아닙니다."
                curl -sf "${DEBEZIUM_URL}/connectors/${connector_name}/status"
                return 1
              }

              # auction-service Outbox 커넥터 등록/갱신
              curl -sf -X PUT "${DEBEZIUM_URL}/connectors/auction-outbox-connector/config" \
                -H "Content-Type: application/json" \
                -d "{
                  \"connector.class\": \"io.debezium.connector.postgresql.PostgresConnector\",
                  \"plugin.name\": \"pgoutput\",
                  \"database.hostname\": \"${AUCTION_POSTGRES_HOST}\",
                  \"database.port\": \"${AUCTION_POSTGRES_PORT}\",
                  \"database.user\": \"${POSTGRES_USER}\",
                  \"database.password\": \"${POSTGRES_PASSWORD}\",
                  \"database.dbname\": \"${AUCTION_POSTGRES_DB}\",
                  \"topic.prefix\": \"auction-db\",
                  \"slot.name\": \"debezium_auction\",
                  \"publication.name\": \"debezium_auction_pub\",
                  \"table.include.list\": \"public.outbox_events\",
                  \"snapshot.mode\": \"never\",
                  \"transforms\": \"outbox\",
                  \"transforms.outbox.type\": \"io.debezium.transforms.outbox.EventRouter\",
                  \"transforms.outbox.route.by.field\": \"aggregate_type\",
                  \"transforms.outbox.table.field.event.key\": \"aggregate_id\",
                  \"transforms.outbox.table.field.event.type\": \"event_type\",
                  \"transforms.outbox.table.field.event.payload\": \"payload\",
                  \"transforms.outbox.route.topic.replacement\": \"auction-events\",
                  \"key.converter\": \"org.apache.kafka.connect.storage.StringConverter\",
                  \"value.converter\": \"io.debezium.converters.BinaryDataConverter\",
                  \"value.converter.delegate.converter.type\": \"org.apache.kafka.connect.json.JsonConverter\",
                  \"value.converter.delegate.converter.type.schemas.enable\": \"false\"
                }"
              echo "auction-outbox-connector applied."
              wait_for_connector_running "auction-outbox-connector"

              # bid-service Outbox 커넥터 등록/갱신
              curl -sf -X PUT "${DEBEZIUM_URL}/connectors/bid-outbox-connector/config" \
                -H "Content-Type: application/json" \
                -d "{
                  \"connector.class\": \"io.debezium.connector.postgresql.PostgresConnector\",
                  \"plugin.name\": \"pgoutput\",
                  \"database.hostname\": \"${BID_POSTGRES_HOST}\",
                  \"database.port\": \"${BID_POSTGRES_PORT}\",
                  \"database.user\": \"${POSTGRES_USER}\",
                  \"database.password\": \"${POSTGRES_PASSWORD}\",
                  \"database.dbname\": \"${BID_POSTGRES_DB}\",
                  \"topic.prefix\": \"bid-db\",
                  \"slot.name\": \"debezium_bid\",
                  \"publication.name\": \"debezium_bid_pub\",
                  \"table.include.list\": \"public.outbox_events\",
                  \"snapshot.mode\": \"never\",
                  \"transforms\": \"outbox\",
                  \"transforms.outbox.type\": \"io.debezium.transforms.outbox.EventRouter\",
                  \"transforms.outbox.route.by.field\": \"aggregate_type\",
                  \"transforms.outbox.table.field.event.key\": \"event_key\",
                  \"transforms.outbox.table.field.event.type\": \"event_type\",
                  \"transforms.outbox.table.field.event.payload\": \"payload\",
                  \"transforms.outbox.route.topic.replacement\": \"bid-events\",
                  \"key.converter\": \"org.apache.kafka.connect.storage.StringConverter\",
                  \"value.converter\": \"io.debezium.converters.BinaryDataConverter\",
                  \"value.converter.delegate.converter.type\": \"org.apache.kafka.connect.json.JsonConverter\",
                  \"value.converter.delegate.converter.type.schemas.enable\": \"false\"
                }"
              echo "bid-outbox-connector applied."
              wait_for_connector_running "bid-outbox-connector"
