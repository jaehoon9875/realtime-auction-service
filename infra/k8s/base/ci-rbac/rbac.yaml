apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-argocd
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-argocd
  namespace: argocd
subjects:
  - kind: User
    name: github-actions-sa@realtime-auction-service.iam.gserviceaccount.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: github-actions-argocd
  apiGroup: rbac.authorization.k8s.io
