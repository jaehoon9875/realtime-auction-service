apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: combined
  namespace: auction
  labels:
    strimzi.io/cluster: auction-kafka
spec:
  replicas: 2
  # controller + broker 겸용 — dev 2노드 환경에서 파드 수 최소화
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        class: standard-rwo
        deleteClaim: false
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"
  jvmOptions:
    -Xms: 512m
    -Xmx: 1g
