apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Phase 5에서 base 리소스 참조 추가 예정. CD(ci.yml)가 이미지 태그만 갱신한다.
images:
  - name: api-gateway
    newName: asia-northeast3-docker.pkg.dev/PROJECT_ID/auction-images/api-gateway
    newTag: init
  - name: auction-service
    newName: asia-northeast3-docker.pkg.dev/PROJECT_ID/auction-images/auction-service
    newTag: init
  - name: bid-service
    newName: asia-northeast3-docker.pkg.dev/PROJECT_ID/auction-images/bid-service
    newTag: init
  - name: user-service
    newName: asia-northeast3-docker.pkg.dev/PROJECT_ID/auction-images/user-service
    newTag: init
  - name: notification-service
    newName: asia-northeast3-docker.pkg.dev/PROJECT_ID/auction-images/notification-service
    newTag: init
  - name: auction-streams
    newName: asia-northeast3-docker.pkg.dev/PROJECT_ID/auction-images/auction-streams
    newTag: init
