apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# CD 파이프라인(cd.yml)이 이미지 태그를 SHORT_SHA로 갱신한다
images:
  - name: api-gateway
    newName: asia-northeast3-docker.pkg.dev/realtime-auction-service/auction-images/api-gateway
    newTag: init
  - name: auction-service
    newName: asia-northeast3-docker.pkg.dev/realtime-auction-service/auction-images/auction-service
    newTag: init
  - name: bid-service
    newName: asia-northeast3-docker.pkg.dev/realtime-auction-service/auction-images/bid-service
    newTag: init
  - name: user-service
    newName: asia-northeast3-docker.pkg.dev/realtime-auction-service/auction-images/user-service
    newTag: init
  - name: notification-service
    newName: asia-northeast3-docker.pkg.dev/realtime-auction-service/auction-images/notification-service
    newTag: init
  - name: auction-streams
    newName: asia-northeast3-docker.pkg.dev/realtime-auction-service/auction-images/auction-streams
    newTag: init
