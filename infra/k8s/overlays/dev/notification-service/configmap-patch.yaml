# dev 환경 ConfigMap 실제 값 (base placeholder 대체)
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-configmap
  namespace: auction
data:
  SERVER_PORT: "8084"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: auction-kafka-kafka-bootstrap:9092
  SCHEMA_REGISTRY_URL: http://schema-registry-service:8085
  JWK_SET_URI: http://user-service-service:8083/.well-known/jwks.json
  KAFKA_NOTIFICATION_EVENTS_TOPIC: notification-events
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo.monitoring:4318/v1/traces
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
