# dev 환경 ConfigMap 실제 값 (base placeholder 대체)
apiVersion: v1
kind: ConfigMap
metadata:
  name: auction-streams-configmap
  namespace: auction
data:
  AUCTION_STREAMS_PORT: "8086"
  KAFKA_BOOTSTRAP_SERVERS: auction-kafka-kafka-bootstrap:9092
  KAFKA_STREAMS_APPLICATION_ID: auction-streams
  SCHEMA_REGISTRY_URL: http://schema-registry-service:8085
  KAFKA_STREAMS_STATE_DIR: /var/lib/kafka-streams
  AUCTION_STREAMS_PUNCTUATOR_INTERVAL_SECONDS: "30"
  AUCTION_STREAMS_MAX_FAILURES: "5"
  AUCTION_STREAMS_IQ_PEER_CONNECT_TIMEOUT_MS: "2000"
  AUCTION_STREAMS_IQ_PEER_READ_TIMEOUT_MS: "3000"
  KAFKA_STREAMS_APPLICATION_SERVER: auction-streams-service:8086
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://alloy.monitoring:4318/v1/traces
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_SCHEDULE_DELAY: "1s"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
