# dev 환경 ConfigMap 실제 값 (base placeholder 대체)
apiVersion: v1
kind: ConfigMap
metadata:
  name: bid-service-configmap
  namespace: auction
data:
  BID_SERVICE_PORT: "8082"
  POSTGRES_HOST: localhost
  POSTGRES_BID_PORT: "5432"
  POSTGRES_BID_DB_NAME: bid_db
  POSTGRES_USER: bid_user
  CLOUD_SQL_CONNECTION_NAME: realtime-auction-service:asia-northeast3:bid-db
  JWK_SET_URI: http://user-service-service:8083/.well-known/jwks.json
  SWAGGER_ENABLED: "true"
  AUCTION_SERVICE_BASE_URL: http://auction-service-service:8081
  AUCTION_SERVICE_CONNECT_TIMEOUT: "2000"
  AUCTION_SERVICE_READ_TIMEOUT: "3000"
  AUCTION_STREAMS_BASE_URL: http://auction-streams-service:8086
  AUCTION_STREAMS_CONNECT_TIMEOUT: "2000"
  AUCTION_STREAMS_READ_TIMEOUT: "3000"
  SCHEMA_REGISTRY_URL: http://schema-registry-service:8085
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo.monitoring:4318/v1/traces
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
