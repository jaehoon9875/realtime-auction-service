<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>실시간 경매 · Live</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #2f81f7;
    --up: #3fb950;
    --down: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "SF Pro Text", "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -0.2px; }
  .back-btn {
    font-size: 13px; color: var(--muted); background: none;
    border: none; cursor: pointer; padding: 4px 8px; margin-left: -8px;
  }
  .back-btn:hover { color: var(--text); }
  .status {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; color: var(--muted);
    margin-left: auto;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); transition: background .2s; }
  .dot.on { background: var(--up); box-shadow: 0 0 8px var(--up); }
  .dot.off { background: var(--down); }

  .config {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .config label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
  .config input {
    width: 100%; padding: 8px 10px; font-size: 13px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .config input:focus { outline: none; border-color: var(--accent); }
  .actions { display: flex; gap: 8px; align-items: flex-end; }
  button {
    padding: 9px 16px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--accent); color: #fff; cursor: pointer;
    white-space: nowrap;
  }
  button.secondary { background: transparent; color: var(--text); }
  button:disabled { opacity: .4; cursor: not-allowed; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }
  .auction-title { font-size: 16px; color: var(--muted); margin-bottom: 6px; }
  .auction-id { font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; margin-bottom: 28px; }
  .price-label { font-size: 14px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .price {
    font-size: clamp(56px, 14vw, 140px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
    transition: transform .15s ease, color .15s ease;
  }
  .price .won { font-size: .42em; color: var(--muted); font-weight: 600; margin-left: 6px; }
  .price.flash { color: var(--up); transform: scale(1.06); }
  .meta {
    margin-top: 30px;
    display: flex; gap: 40px; justify-content: center; flex-wrap: wrap;
  }
  .meta .item .num { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .meta .item .cap { font-size: 12px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .5px; }
  .closed-badge {
    margin-top: 24px; display: none;
    padding: 8px 18px; border-radius: 999px;
    background: rgba(248,81,73,.15); color: var(--down);
    font-size: 14px; font-weight: 700; border: 1px solid var(--down);
  }

  .log {
    border-top: 1px solid var(--border);
    background: var(--panel);
    max-height: 180px; overflow-y: auto;
    padding: 10px 20px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px; line-height: 1.6;
  }
  .log .line { color: var(--muted); white-space: pre-wrap; word-break: break-all; }
  .log .line .t { color: var(--accent); }
  .log .line.new { color: var(--up); }
</style>
</head>
<body>
  <header>
    <button class="back-btn" onclick="location.href='auctions.html'">← 목록</button>
    <h1>🔨 실시간 경매 · Live</h1>
    <span class="status"><span id="dot" class="dot"></span><span id="statusText">연결 안 됨</span></span>
  </header>

  <section class="config">
    <div>
      <label>WebSocket Base (gateway)</label>
      <input id="wsBase" placeholder="ws://34.xx.xx.xx" />
    </div>
    <div>
      <label>Auction ID</label>
      <input id="auctionId" placeholder="경매 UUID" />
    </div>
    <div>
      <label>JWT Token</label>
      <input id="token" placeholder="accessToken (Bearer 값)" />
    </div>
    <div class="actions">
      <button id="connectBtn">연결</button>
      <button id="disconnectBtn" class="secondary" disabled>해제</button>
    </div>
  </section>

  <main>
    <div class="auction-title" id="auctionTitle">실시간 경매</div>
    <div class="auction-id" id="auctionIdLabel"></div>
    <div class="price-label">현재가</div>
    <div class="price" id="price">—<span class="won">원</span></div>
    <div class="meta">
      <div class="item"><div class="num" id="bidCount">0</div><div class="cap">입찰 횟수</div></div>
      <div class="item"><div class="num" id="updatedAt">—</div><div class="cap">최근 갱신</div></div>
    </div>
    <div class="closed-badge" id="closedBadge">경매 종료 · 낙찰</div>
  </main>

  <div class="log" id="log"></div>

<script>
  // ── DOM 참조 ──────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const wsBaseEl = $("wsBase"), auctionIdEl = $("auctionId"), tokenEl = $("token");
  const priceEl = $("price"), bidCountEl = $("bidCount"), updatedAtEl = $("updatedAt");
  const dotEl = $("dot"), statusTextEl = $("statusText"), logEl = $("log");
  const connectBtn = $("connectBtn"), disconnectBtn = $("disconnectBtn");
  const closedBadge = $("closedBadge"), auctionIdLabel = $("auctionIdLabel");

  // 우선순위: URL ?id= → localStorage(login) → localStorage(live-cfg) → 수동 입력
  const LS_LOGIN = "auction-demo-cfg";
  const LS_LIVE  = "auction-live-cfg";

  function loadCfg() {
    const params  = new URLSearchParams(location.search);
    const login   = (() => { try { return JSON.parse(localStorage.getItem(LS_LOGIN) || "{}"); } catch(_) { return {}; } })();
    const live    = (() => { try { return JSON.parse(localStorage.getItem(LS_LIVE)  || "{}"); } catch(_) { return {}; } })();

    // WS Base: login base(http→ws) > live cfg > 수동
    const httpBase = login.base || "";
    const wsBase   = httpBase
      ? httpBase.replace(/^http:\/\//, "ws://").replace(/^https:\/\//, "wss://")
      : (live.wsBase || "");
    wsBaseEl.value    = wsBase;

    // Auction ID: URL 파라미터 > live cfg
    auctionIdEl.value = params.get("id") || live.auctionId || "";

    // JWT: login token > live cfg
    tokenEl.value     = login.token || live.token || "";
  }

  function saveCfg() {
    localStorage.setItem(LS_LIVE, JSON.stringify({
      wsBase:    wsBaseEl.value.trim(),
      auctionId: auctionIdEl.value.trim(),
      token:     tokenEl.value.trim(),
    }));
  }
  loadCfg();

  function fmt(n) { return Number(n).toLocaleString("ko-KR"); }
  function nowStr() {
    const d = new Date();
    return d.toLocaleTimeString("ko-KR", { hour12: false }) + "." + String(d.getMilliseconds()).padStart(3, "0");
  }
  function log(msg, isNew) {
    const div = document.createElement("div");
    div.className = "line" + (isNew ? " new" : "");
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = nowStr();
    div.append(t, "  " + msg);
    logEl.prepend(div);
    while (logEl.childElementCount > 50) logEl.lastChild.remove();
  }

  function setStatus(state, text) {
    dotEl.className = "dot " + state;   // on | off | ""
    statusTextEl.textContent = text;
  }

  let ws = null;

  function connect() {
    const base = wsBaseEl.value.trim().replace(/\/$/, "");
    const auctionId = auctionIdEl.value.trim();
    const token = tokenEl.value.trim();
    if (!base || !auctionId || !token) { alert("WS Base, Auction ID, JWT를 모두 입력하세요."); return; }
    saveCfg();

    const url = `${base}/ws/auctions/${auctionId}?token=${encodeURIComponent(token)}`;
    auctionIdLabel.textContent = "auctionId: " + auctionId;
    log("연결 시도 → " + base + "/ws/auctions/" + auctionId);

    ws = new WebSocket(url);
    setStatus("", "연결 중…");

    ws.onopen = () => {
      setStatus("on", "연결됨 · 구독 중");
      connectBtn.disabled = true; disconnectBtn.disabled = false;
      log("WebSocket 연결 성공 ✓");
    };
    ws.onmessage = (ev) => handleMessage(ev.data);
    ws.onerror = () => log("WebSocket 오류 발생");
    ws.onclose = (ev) => {
      setStatus("off", "연결 끊김 (code " + ev.code + ")");
      connectBtn.disabled = false; disconnectBtn.disabled = true;
      log("연결 종료 (code " + ev.code + ")");
    };
  }

  function disconnect() { if (ws) ws.close(); }

  // 서버는 docs/api.md 형식의 JSON 텍스트를 그대로 push한다.
  function handleMessage(raw) {
    log("◀ " + raw, true);
    let msg;
    try { msg = JSON.parse(raw); } catch (_) { return; }

    if (msg.type === "BID_UPDATED" || msg.type === "OUTBID") {
      if (msg.currentPrice != null) updatePrice(msg.currentPrice);
      if (msg.bidCount != null) bidCountEl.textContent = fmt(msg.bidCount);
      updatedAtEl.textContent = new Date().toLocaleTimeString("ko-KR", { hour12: false });
    } else if (msg.type === "AUCTION_CLOSED" || msg.type === "AUCTION_WON") {
      if (msg.finalPrice != null) updatePrice(msg.finalPrice);
      closedBadge.style.display = "inline-block";
      setStatus("on", "경매 종료");
    }
  }

  function updatePrice(value) {
    priceEl.innerHTML = fmt(value) + '<span class="won">원</span>';
    priceEl.classList.remove("flash");
    void priceEl.offsetWidth; // reflow → 애니메이션 재시작
    priceEl.classList.add("flash");
    setTimeout(() => priceEl.classList.remove("flash"), 350);
  }

  connectBtn.addEventListener("click", connect);
  disconnectBtn.addEventListener("click", disconnect);
  [wsBaseEl, auctionIdEl, tokenEl].forEach((el) => el.addEventListener("change", saveCfg));

  // auctions.html에서 ?id= 로 넘어온 경우 자동 연결
  if (new URLSearchParams(location.search).get("id") && wsBaseEl.value && tokenEl.value) {
    connect();
  }
</script>
</body>
</html>
