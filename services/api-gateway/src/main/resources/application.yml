spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # ── CORS 설정 ────────────────────────────────────────────────────────────
          # 브라우저는 cross-origin 요청 전에 Origin 헤더를 서버에 보내고,
          # 서버가 Access-Control-Allow-Origin 헤더를 돌려줘야 실제 요청을 허용한다.
          # curl·k6·서비스 간 내부 호출 등 비브라우저 클라이언트는 이 검사를 하지 않으므로
          # 아래 설정은 브라우저 전용이며 기존 API 동작에 영향을 주지 않는다.
          #
          # allowedOriginPatterns: "http://localhost:*"
          #   로컬에서 demo/*.html 을 HTTP 서버로 띄워 Gateway API를 호출할 때 필요하다.
          #   실제 사용자 트래픽의 Origin은 localhost가 아니므로 프로덕션 요청에 영향 없음.
          #
          # allowCredentials 미설정(기본값 false):
          #   이 API는 인증을 쿠키가 아닌 Authorization 헤더(JWT Bearer)와
          #   WebSocket 핸드셰이크 시 ?token= 쿼리 파라미터로 처리한다.
          #   allowCredentials: true 는 쿠키 기반 인증에서 필요한 설정이므로
          #   여기서는 불필요하며 보안 리스크를 줄이기 위해 명시적으로 제외한다.
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "http://localhost:*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                maxAge: 3600
          routes:
            # User Service (README 포트: 8083)
            # 외부: /api/users/** → 내부: /users/** (첫 세그먼트 api 제거)
            - id: user-service
              uri: ${USER_SERVICE_URI}
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1

            # Auction Service
            # 외부: /api/auctions/** → 내부: /auctions/** (첫 세그먼트 api 제거)
            # AddRequestHeader: Gateway를 경유한 요청임을 auction-service가 검증할 수 있도록
            # X-Internal-Request-Token 헤더에 사전 공유 시크릿을 주입한다.
            # auction-service의 app.security.internal-request-secret 값과 반드시 일치해야 함.
            # 참고: docs/internal-service-auth.md
            - id: auction-service
              uri: ${AUCTION_SERVICE_URI}
              predicates:
                - Path=/api/auctions/**
              filters:
                - StripPrefix=1
                - SetRequestHeader=X-Internal-Request-Token, ${INTERNAL_REQUEST_SECRET}

            # Bid Service — M4 이후 구현 시 확인
            # 외부: /api/bids/** → 내부: /bids/** 가정
            - id: bid-service
              uri: ${BID_SERVICE_URI}
              predicates:
                - Path=/api/bids/**
              filters:
                - StripPrefix=1
                - SetRequestHeader=X-Internal-Request-Token, ${INTERNAL_REQUEST_SECRET}

            # Notification Service — M6 이후 구현 시 확인
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI}
              predicates:
                - Path=/ws/**

            # API 문서 프록시 — Gateway 통합 Swagger UI 집계용
            # X-Forwarded-Prefix: /api 주입 → 각 서비스가 servers URL을 /api 로 동적 생성
            - id: user-service-docs
              uri: ${USER_SERVICE_URI}
              predicates:
                - Path=/user-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
                - SetRequestHeader=X-Forwarded-Prefix, /api

            - id: auction-service-docs
              uri: ${AUCTION_SERVICE_URI}
              predicates:
                - Path=/auction-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
                - SetRequestHeader=X-Forwarded-Prefix, /api
                - SetRequestHeader=X-Internal-Request-Token, ${INTERNAL_REQUEST_SECRET}

            - id: bid-service-docs
              uri: ${BID_SERVICE_URI}
              predicates:
                - Path=/bid-service/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
                - SetRequestHeader=X-Forwarded-Prefix, /api
                - SetRequestHeader=X-Internal-Request-Token, ${INTERNAL_REQUEST_SECRET}

server:
  port: ${API_GATEWAY_PORT:8080}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 각 서비스 api-docs를 Gateway 프록시 경로로 지정 (CORS 없이 동일 오리진 처리)
    urls:
      - name: user-service
        url: /user-service/v3/api-docs
      - name: auction-service
        url: /auction-service/v3/api-docs
      - name: bid-service
        url: /bid-service/v3/api-docs
  api-docs:
    # Gateway 자체는 문서화할 컨트롤러가 없으므로 비활성화
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
app:
  security:
    # Gateway가 받는 외부 경로 (StripPrefix 전). user-service의 /users/* 와 1:1 대응
    public-endpoints:
      - /api/users/signup
      - /api/users/login
      - /api/users/refresh
      - /actuator/health
      - /actuator/prometheus
  jwt:
    public-key: ${JWT_PUBLIC_KEY}
logging:
  structured:
    format:
      console: logstash
