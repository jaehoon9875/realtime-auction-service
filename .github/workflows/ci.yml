name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'infra/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'infra/**'

jobs:
  # 변경된 서비스만 골라 matrix JSON을 생성한다.
  # 루트 빌드 파일(*.gradle.kts, settings.gradle.kts) 변경 시 전체 서비스 실행.
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            root-build:
              - '*.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
            api-gateway:
              - 'services/api-gateway/**'
            user-service:
              - 'services/user-service/**'
            auction-service:
              - 'services/auction-service/**'
            bid-service:
              - 'services/bid-service/**'
            notification-service:
              - 'services/notification-service/**'
            auction-streams:
              - 'streams/auction-streams/**'

      - id: set-matrix
        run: |
          # 루트 빌드 파일 변경 → 전체 서비스 실행
          if [ "${{ steps.filter.outputs.root-build }}" = "true" ]; then
            echo 'matrix={"include":[{"service":"api-gateway","path":"services/api-gateway","gradle_task":":services:api-gateway"},{"service":"user-service","path":"services/user-service","gradle_task":":services:user-service"},{"service":"auction-service","path":"services/auction-service","gradle_task":":services:auction-service"},{"service":"bid-service","path":"services/bid-service","gradle_task":":services:bid-service"},{"service":"notification-service","path":"services/notification-service","gradle_task":":services:notification-service"},{"service":"auction-streams","path":"streams/auction-streams","gradle_task":":streams:auction-streams"}]}' >> $GITHUB_OUTPUT
            exit 0
          fi

          matrix='{"include":['
          first=true
          add() {
            [ "$first" = false ] && matrix+=','
            matrix+="{\"service\":\"$1\",\"path\":\"$2\",\"gradle_task\":\"$3\"}"
            first=false
          }

          [ "${{ steps.filter.outputs.api-gateway }}"         = "true" ] && add "api-gateway"         "services/api-gateway"         ":services:api-gateway"
          [ "${{ steps.filter.outputs.user-service }}"         = "true" ] && add "user-service"         "services/user-service"         ":services:user-service"
          [ "${{ steps.filter.outputs.auction-service }}"      = "true" ] && add "auction-service"      "services/auction-service"      ":services:auction-service"
          [ "${{ steps.filter.outputs.bid-service }}"          = "true" ] && add "bid-service"          "services/bid-service"          ":services:bid-service"
          [ "${{ steps.filter.outputs.notification-service }}" = "true" ] && add "notification-service" "services/notification-service" ":services:notification-service"
          [ "${{ steps.filter.outputs.auction-streams }}"      = "true" ] && add "auction-streams"      "streams/auction-streams"       ":streams:auction-streams"

          matrix+=']}'
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build-and-test:
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
      fail-fast: false  # 한 서비스 실패해도 나머지는 계속 실행

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # build.gradle.kts 존재 여부로 서비스 구현 여부 판단
      - name: Check if service is implemented
        id: check
        run: |
          if [ -f ${{ matrix.path }}/build.gradle.kts ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::notice::${{ matrix.service }}: build.gradle.kts not found, skipping checks."
          fi

      - name: Cache Gradle packages
        if: steps.check.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.service }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.service }}-
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        if: steps.check.outputs.ready == 'true'
        run: chmod +x gradlew

      # ── Build ───────────────────────────────
      - name: Build (Gradle)
        if: steps.check.outputs.ready == 'true'
        run: ./gradlew ${{ matrix.gradle_task }}:build -x test --stacktrace

      # ── Test ────────────────────────────────
      - name: Test (JUnit + Testcontainers)
        if: steps.check.outputs.ready == 'true'
        run: ./gradlew ${{ matrix.gradle_task }}:test --stacktrace
        env:
          SPRING_PROFILES_ACTIVE: test

      # ── Test Report ─────────────────────────
      - name: Upload test results
        if: steps.check.outputs.ready == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.path }}/build/reports/tests/test/
