name: CI

on:
  pull_request:
    branches: [main]
  # 기존에는 main push에서도 CI를 실행해 변경 서비스 이미지를 Google Artifact Registry에 push했다.
  # 현재는 GKE/GCP 실습 환경을 내려 비용 발생 가능성을 줄이는 마무리 단계이므로,
  # PR 검증용 CI만 유지하고 main push 트리거는 보존 주석으로 남긴다.
  # push:
  #   branches: [main]

env:
  GCP_REGION: asia-northeast3
  AR_REPO: auction-images

jobs:
  # 변경된 서비스만 골라 matrix JSON을 생성한다.
  # docs/infra/md만 변경 시 matrix가 비어 build-and-test는 스킵되지만, 이 잡은 항상 실행되어 required check를 만족한다.
  # 루트 빌드 파일(*.gradle.kts, settings.gradle.kts) 변경 시 전체 서비스 실행.
  changes:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      avro-changed: ${{ steps.filter.outputs.avro }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            root-build:
              - '*.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'infra/avro/**'
            avro:
              - 'infra/avro/**'
            api-gateway:
              - 'services/api-gateway/**'
            user-service:
              - 'services/user-service/**'
            auction-service:
              - 'services/auction-service/**'
            bid-service:
              - 'services/bid-service/**'
            notification-service:
              - 'services/notification-service/**'
            auction-streams:
              - 'streams/auction-streams/**'

      - id: set-matrix
        run: |
          # 루트 빌드 파일 변경 → 전체 서비스 실행
          if [ "${{ steps.filter.outputs.root-build }}" = "true" ]; then
            echo 'matrix={"include":[{"service":"api-gateway","path":"services/api-gateway","gradle_task":":services:api-gateway","dockerfile":"services/api-gateway/Dockerfile"},{"service":"user-service","path":"services/user-service","gradle_task":":services:user-service","dockerfile":"services/user-service/Dockerfile"},{"service":"auction-service","path":"services/auction-service","gradle_task":":services:auction-service","dockerfile":"services/auction-service/Dockerfile"},{"service":"bid-service","path":"services/bid-service","gradle_task":":services:bid-service","dockerfile":"services/bid-service/Dockerfile"},{"service":"notification-service","path":"services/notification-service","gradle_task":":services:notification-service","dockerfile":"services/notification-service/Dockerfile"},{"service":"auction-streams","path":"streams/auction-streams","gradle_task":":streams:auction-streams","dockerfile":"streams/auction-streams/Dockerfile"}]}' >> $GITHUB_OUTPUT
            exit 0
          fi

          matrix='{"include":['
          first=true
          add() {
            [ "$first" = false ] && matrix+=','
            matrix+="{\"service\":\"$1\",\"path\":\"$2\",\"gradle_task\":\"$3\",\"dockerfile\":\"$4\"}"
            first=false
          }

          [ "${{ steps.filter.outputs.api-gateway }}"         = "true" ] && add "api-gateway"         "services/api-gateway"         ":services:api-gateway"         "services/api-gateway/Dockerfile"
          [ "${{ steps.filter.outputs.user-service }}"         = "true" ] && add "user-service"         "services/user-service"         ":services:user-service"         "services/user-service/Dockerfile"
          [ "${{ steps.filter.outputs.auction-service }}"      = "true" ] && add "auction-service"      "services/auction-service"      ":services:auction-service"      "services/auction-service/Dockerfile"
          [ "${{ steps.filter.outputs.bid-service }}"          = "true" ] && add "bid-service"          "services/bid-service"          ":services:bid-service"          "services/bid-service/Dockerfile"
          [ "${{ steps.filter.outputs.notification-service }}" = "true" ] && add "notification-service" "services/notification-service" ":services:notification-service" "services/notification-service/Dockerfile"
          [ "${{ steps.filter.outputs.auction-streams }}"      = "true" ] && add "auction-streams"      "streams/auction-streams"       ":streams:auction-streams"       "streams/auction-streams/Dockerfile"

          matrix+=']}'
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build-and-test:
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
      fail-fast: false  # 한 서비스 실패해도 나머지는 계속 실행

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # build.gradle.kts 존재 여부로 서비스 구현 여부 판단
      - name: Check if service is implemented
        id: check
        run: |
          if [ -f ${{ matrix.path }}/build.gradle.kts ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::notice::${{ matrix.service }}: build.gradle.kts not found, skipping checks."
          fi

      - name: Cache Gradle packages
        if: steps.check.outputs.ready == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.service }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.service }}-
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        if: steps.check.outputs.ready == 'true'
        run: chmod +x gradlew

      # ── Build ───────────────────────────────
      - name: Build (Gradle)
        if: steps.check.outputs.ready == 'true'
        run: ./gradlew ${{ matrix.gradle_task }}:build -x test --stacktrace

      # ── Test ────────────────────────────────
      - name: Test (JUnit + Testcontainers)
        if: steps.check.outputs.ready == 'true'
        run: ./gradlew ${{ matrix.gradle_task }}:test --stacktrace
        env:
          SPRING_PROFILES_ACTIVE: test

      # ── Test Report ─────────────────────────
      - name: Upload test results
        if: steps.check.outputs.ready == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.path }}/build/reports/tests/test/

  # infra/avro/** 변경 PR에서 새 .avsc가 기존 등록 스키마와 호환되는지 검사한다.
  # baseline: base 브랜치의 .avsc를 임시 Schema Registry에 등록 → PR 버전으로 /compatibility 호출.
  # 신규 스키마(base에 없음)는 호환성 검사 대상에서 제외한다.
  avro-compatibility:
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      needs.changes.outputs.avro-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Start Kafka and Schema Registry
        run: docker compose -f infra/docker-compose.avro-ci.yml up -d

      - name: Wait for Schema Registry to be ready
        run: |
          echo "Waiting for Schema Registry..."
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8085/subjects > /dev/null 2>&1; then
              echo "Schema Registry is ready (attempt $i)"
              exit 0
            fi
            echo "  [$i/40] not ready yet, retrying in 3s..."
            sleep 3
          done
          echo "Schema Registry did not become ready in time"
          docker compose -f infra/docker-compose.avro-ci.yml logs
          exit 1

      - name: Register base branch schemas as baseline
        env:
          REGISTRY_URL: http://localhost:8085
        run: |
          set -euo pipefail
          # subject 매핑: 파일명 → Schema Registry subject 이름
          declare -A FILE_TO_SUBJECT=(
            ["AuctionEvent.avsc"]="auction-events-value"
            ["BidEvent.avsc"]="bid-events-value"
            ["NotificationEvent.avsc"]="notification-events-value"
          )
          BASE_REF="origin/${{ github.base_ref }}"

          # 로컬·CI 동일 정책 보장: register-schemas.sh와 동일하게 FULL로 설정
          curl -sS -X PUT "${REGISTRY_URL}/config" \
            -H "Content-Type: application/vnd.schemaregistry.v1+json" \
            -d '{"compatibility": "FULL"}' > /dev/null

          for file in "${!FILE_TO_SUBJECT[@]}"; do
            subject="${FILE_TO_SUBJECT[$file]}"
            if git show "${BASE_REF}:infra/avro/${file}" > "/tmp/base_${file}" 2>/dev/null; then
              body="$(jq -n --arg schema "$(jq -c . "/tmp/base_${file}")" '{schema: $schema}')"
              curl -sf -X POST "${REGISTRY_URL}/subjects/${subject}/versions" \
                -H "Content-Type: application/vnd.schemaregistry.v1+json" \
                -d "${body}" > /dev/null
              echo "Registered baseline: ${subject}"
            else
              echo "New schema (not in ${BASE_REF}): ${file} — skipping baseline registration"
            fi
          done

      - name: Check PR schemas for compatibility
        env:
          REGISTRY_URL: http://localhost:8085
        run: |
          set -euo pipefail
          declare -A FILE_TO_SUBJECT=(
            ["infra/avro/AuctionEvent.avsc"]="auction-events-value"
            ["infra/avro/BidEvent.avsc"]="bid-events-value"
            ["infra/avro/NotificationEvent.avsc"]="notification-events-value"
          )
          FAILED=false

          for file in "${!FILE_TO_SUBJECT[@]}"; do
            subject="${FILE_TO_SUBJECT[$file]}"

            # baseline이 없는 신규 스키마는 호환성 검사 대상 아님
            if ! curl -sf "${REGISTRY_URL}/subjects/${subject}/versions/latest" > /dev/null 2>&1; then
              echo "SKIP  ${file} — no baseline registered for ${subject}"
              continue
            fi

            body="$(jq -n --arg schema "$(jq -c . "${file}")" '{schema: $schema}')"
            response="$(curl -s -X POST \
              "${REGISTRY_URL}/compatibility/subjects/${subject}/versions/latest" \
              -H "Content-Type: application/vnd.schemaregistry.v1+json" \
              -d "${body}")"

            if echo "${response}" | jq -e '.is_compatible == true' > /dev/null 2>&1; then
              echo "PASS  ${file}"
            else
              echo "FAIL  ${file}"
              echo "      response: ${response}"
              FAILED=true
            fi
          done

          if [ "${FAILED}" = "true" ]; then
            echo "::error::Avro 스키마 호환성 위반이 감지됐습니다. 위 FAIL 항목을 확인하세요."
            exit 1
          fi
          echo "All schema compatibility checks passed."

  # PR: 변경된 서비스만 Docker 빌드 검증 (push 없음)
  docker-build:
    needs: [changes, ci-success]
    if: |
      github.event_name == 'pull_request' &&
      needs.changes.outputs.matrix != '{"include":[]}'
    name: docker-${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::notice::${{ matrix.service }}: Dockerfile not found, skipping docker build."
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        if: steps.check.outputs.ready == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # main push: 변경된 서비스 이미지만 빌드·푸시 (변경 없는 서비스는 재푸시하지 않음)
  # 현재는 GKE/GCP 실습 환경을 내려둔 상태라 Artifact Registry push를 막기 위해 비활성화한다.
  # 다시 배포 환경을 사용할 때는 on.push 주석을 되돌리고 아래 if의 false 가드를 제거한다.
  docker-build-push:
    needs: [changes, ci-success]
    # always()가 없으면 docs-only push 시 build-and-test skipped → skip 전파로 이 job도 스킵됨.
    # 매트릭스가 changes 기준이라 변경된 서비스만 돈다. docs-only면 matrix가 비어 이 job 자체가 스킵된다.
    if: |
      false &&
      always() &&
      needs.ci-success.result == 'success' &&
      needs.changes.outputs.matrix != '{"include":[]}' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    name: push-${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::error::${{ matrix.service }}: Dockerfile not found."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        if: steps.check.outputs.ready == 'true'
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Login to Artifact Registry
        if: steps.check.outputs.ready == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Set short SHA
        if: steps.check.outputs.ready == 'true'
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Build and push Docker image
        if: steps.check.outputs.ready == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.service }}:${{ env.SHORT_SHA }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # build-and-test·avro-compatibility가 스킵되어도 워크플로가 성공으로 끝나도록 항상 실행한다.
  ci-success:
    needs: [changes, build-and-test, avro-compatibility]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify CI pipeline
        run: |
          if [[ "${{ github.event_name }}" == "push" && \
                "${{ github.event.head_commit.message }}" == *"[skip ci]"* ]]; then
            echo "Skipped via [skip ci]"
            exit 0
          fi
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "changes job failed (result: ${{ needs.changes.result }})"
            exit 1
          fi
          # success·skipped만 허용 (failure·cancelled 등은 실패 처리)
          if [[ "${{ needs.build-and-test.result }}" != "success" && \
                "${{ needs.build-and-test.result }}" != "skipped" ]]; then
            echo "build-and-test did not succeed (result: ${{ needs.build-and-test.result }})"
            exit 1
          fi
          if [[ "${{ needs.avro-compatibility.result }}" != "success" && \
                "${{ needs.avro-compatibility.result }}" != "skipped" ]]; then
            echo "avro-compatibility did not succeed (result: ${{ needs.avro-compatibility.result }})"
            exit 1
          fi
          echo "CI passed"
