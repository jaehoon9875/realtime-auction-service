name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  GCP_REGION: asia-northeast3
  AR_REPO: auction-images

jobs:
  # 변경된 서비스만 골라 matrix JSON을 생성한다.
  # docs/infra/md만 변경 시 matrix가 비어 build-and-test는 스킵되지만, 이 잡은 항상 실행되어 required check를 만족한다.
  # 루트 빌드 파일(*.gradle.kts, settings.gradle.kts) 변경 시 전체 서비스 실행.
  changes:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            root-build:
              - '*.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'infra/avro/**'
            api-gateway:
              - 'services/api-gateway/**'
            user-service:
              - 'services/user-service/**'
            auction-service:
              - 'services/auction-service/**'
            bid-service:
              - 'services/bid-service/**'
            notification-service:
              - 'services/notification-service/**'
            auction-streams:
              - 'streams/auction-streams/**'

      - id: set-matrix
        run: |
          # 루트 빌드 파일 변경 → 전체 서비스 실행
          if [ "${{ steps.filter.outputs.root-build }}" = "true" ]; then
            echo 'matrix={"include":[{"service":"api-gateway","path":"services/api-gateway","gradle_task":":services:api-gateway","dockerfile":"services/api-gateway/Dockerfile"},{"service":"user-service","path":"services/user-service","gradle_task":":services:user-service","dockerfile":"services/user-service/Dockerfile"},{"service":"auction-service","path":"services/auction-service","gradle_task":":services:auction-service","dockerfile":"services/auction-service/Dockerfile"},{"service":"bid-service","path":"services/bid-service","gradle_task":":services:bid-service","dockerfile":"services/bid-service/Dockerfile"},{"service":"notification-service","path":"services/notification-service","gradle_task":":services:notification-service","dockerfile":"services/notification-service/Dockerfile"},{"service":"auction-streams","path":"streams/auction-streams","gradle_task":":streams:auction-streams","dockerfile":"streams/auction-streams/Dockerfile"}]}' >> $GITHUB_OUTPUT
            exit 0
          fi

          matrix='{"include":['
          first=true
          add() {
            [ "$first" = false ] && matrix+=','
            matrix+="{\"service\":\"$1\",\"path\":\"$2\",\"gradle_task\":\"$3\",\"dockerfile\":\"$4\"}"
            first=false
          }

          [ "${{ steps.filter.outputs.api-gateway }}"         = "true" ] && add "api-gateway"         "services/api-gateway"         ":services:api-gateway"         "services/api-gateway/Dockerfile"
          [ "${{ steps.filter.outputs.user-service }}"         = "true" ] && add "user-service"         "services/user-service"         ":services:user-service"         "services/user-service/Dockerfile"
          [ "${{ steps.filter.outputs.auction-service }}"      = "true" ] && add "auction-service"      "services/auction-service"      ":services:auction-service"      "services/auction-service/Dockerfile"
          [ "${{ steps.filter.outputs.bid-service }}"          = "true" ] && add "bid-service"          "services/bid-service"          ":services:bid-service"          "services/bid-service/Dockerfile"
          [ "${{ steps.filter.outputs.notification-service }}" = "true" ] && add "notification-service" "services/notification-service" ":services:notification-service" "services/notification-service/Dockerfile"
          [ "${{ steps.filter.outputs.auction-streams }}"      = "true" ] && add "auction-streams"      "streams/auction-streams"       ":streams:auction-streams"       "streams/auction-streams/Dockerfile"

          matrix+=']}'
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build-and-test:
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
      fail-fast: false  # 한 서비스 실패해도 나머지는 계속 실행

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # build.gradle.kts 존재 여부로 서비스 구현 여부 판단
      - name: Check if service is implemented
        id: check
        run: |
          if [ -f ${{ matrix.path }}/build.gradle.kts ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::notice::${{ matrix.service }}: build.gradle.kts not found, skipping checks."
          fi

      - name: Cache Gradle packages
        if: steps.check.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.service }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.service }}-
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        if: steps.check.outputs.ready == 'true'
        run: chmod +x gradlew

      # ── Build ───────────────────────────────
      - name: Build (Gradle)
        if: steps.check.outputs.ready == 'true'
        run: ./gradlew ${{ matrix.gradle_task }}:build -x test --stacktrace

      # ── Test ────────────────────────────────
      - name: Test (JUnit + Testcontainers)
        if: steps.check.outputs.ready == 'true'
        run: ./gradlew ${{ matrix.gradle_task }}:test --stacktrace
        env:
          SPRING_PROFILES_ACTIVE: test

      # ── Test Report ─────────────────────────
      - name: Upload test results
        if: steps.check.outputs.ready == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.path }}/build/reports/tests/test/

  # PR: 변경된 서비스만 Docker 빌드 검증 (push 없음)
  docker-build:
    needs: [changes, ci-success]
    if: |
      github.event_name == 'pull_request' &&
      needs.changes.outputs.matrix != '{"include":[]}'
    name: docker-${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::notice::${{ matrix.service }}: Dockerfile not found, skipping docker build."
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: steps.check.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # main push: 전체 서비스 이미지 빌드·푸시 (CD 태그 일관성)
  docker-build-push:
    needs: ci-success
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    name: push-${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: services/api-gateway/Dockerfile
          - service: auction-service
            dockerfile: services/auction-service/Dockerfile
          - service: bid-service
            dockerfile: services/bid-service/Dockerfile
          - service: user-service
            dockerfile: services/user-service/Dockerfile
          - service: notification-service
            dockerfile: services/notification-service/Dockerfile
          - service: auction-streams
            dockerfile: streams/auction-streams/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::error::${{ matrix.service }}: Dockerfile not found."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        if: steps.check.outputs.ready == 'true'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Login to Artifact Registry
        if: steps.check.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Set short SHA
        if: steps.check.outputs.ready == 'true'
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Build and push Docker image
        if: steps.check.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.service }}:${{ env.SHORT_SHA }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # build-and-test가 스킵되어도 워크플로가 성공으로 끝나도록 항상 실행한다.
  ci-success:
    needs: [changes, build-and-test]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify CI pipeline
        run: |
          if [[ "${{ github.event_name }}" == "push" && \
                "${{ github.event.head_commit.message }}" == *"[skip ci]"* ]]; then
            echo "Skipped via [skip ci]"
            exit 0
          fi
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "changes job failed (result: ${{ needs.changes.result }})"
            exit 1
          fi
          # success·skipped만 허용 (failure·cancelled 등은 실패 처리)
          if [[ "${{ needs.build-and-test.result }}" != "success" && \
                "${{ needs.build-and-test.result }}" != "skipped" ]]; then
            echo "build-and-test did not succeed (result: ${{ needs.build-and-test.result }})"
            exit 1
          fi
          echo "CI passed"
