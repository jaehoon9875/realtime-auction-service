name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  GCP_REGION: asia-northeast3
  AR_REPO: auction-images

jobs:
  update-dev-images:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530
        with:
          kustomize-version: "5.8.1"

      - name: Update dev overlay image tags
        working-directory: infra/k8s/overlays/dev/images
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SHORT_SHA="${HEAD_SHA:0:7}"
          REGISTRY="${GCP_REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${AR_REPO}"

          for svc in api-gateway auction-service bid-service user-service notification-service auction-streams; do
            kustomize edit set image "${svc}=${REGISTRY}/${svc}:${SHORT_SHA}"
          done

          echo "Updated image tags to ${SHORT_SHA}"

      - name: Commit and push
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SHORT_SHA="${HEAD_SHA:0:7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No image tag changes to commit"
            exit 0
          fi

          git add infra/k8s/overlays/dev/images/kustomization.yaml
          git commit -m "chore(infra): update dev image tags to ${SHORT_SHA} [skip ci]"
          git push

  smoke-test:
    needs: update-dev-images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Wait for gateway to be ready
        env:
          BASE_URL: ${{ vars.SMOKE_TEST_BASE_URL }}
        run: |
          echo "ArgoCD sync + rollout 대기 (최대 5분)..."
          for i in $(seq 1 30); do
            if curl -sf "${BASE_URL}/actuator/health" | grep -q '"status":"UP"'; then
              echo "Gateway ready (attempt ${i})"
              exit 0
            fi
            echo "  대기 중... ${i}/30"
            sleep 10
          done
          echo "Gateway가 5분 내에 응답하지 않았습니다"
          exit 1

      - name: Run smoke tests
        env:
          BASE_URL: ${{ vars.SMOKE_TEST_BASE_URL }}
        run: |
          chmod +x e2e/smoke.sh
          e2e/smoke.sh
