name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  GCP_REGION: asia-northeast3
  AR_REPO: auction-images

jobs:
  update-dev-images:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530
        with:
          kustomize-version: "5.8.1"

      - name: Verify images exist in Artifact Registry
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SHORT_SHA="${HEAD_SHA:0:7}"
          REGISTRY="${GCP_REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${AR_REPO}"
          MISSING=()

          for svc in api-gateway auction-service bid-service user-service notification-service auction-streams; do
            if ! gcloud artifacts docker images describe "${REGISTRY}/${svc}:${SHORT_SHA}" --quiet 2>/dev/null; then
              MISSING+=("${svc}:${SHORT_SHA}")
            fi
          done

          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "이미지 푸시가 확인되지 않은 서비스가 있습니다. kustomize 업데이트를 중단합니다."
            echo "누락 이미지: ${MISSING[*]}"
            exit 1
          fi
          echo "모든 이미지 확인 완료: ${SHORT_SHA}"

      - name: Update dev overlay image tags
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SHORT_SHA="${HEAD_SHA:0:7}"
          REGISTRY="${GCP_REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${AR_REPO}"

          # 각 서비스 overlay에서 직접 이미지 태그 업데이트
          # (images가 overlay에 직접 정의되어야 ArgoCD kustomize.images 오버라이드가 정상 작동)
          for svc in api-gateway auction-service bid-service user-service notification-service auction-streams; do
            (cd "infra/k8s/overlays/dev/${svc}" && \
              kustomize edit set image "${svc}=${REGISTRY}/${svc}:${SHORT_SHA}")
          done

          echo "Updated image tags to ${SHORT_SHA}"

      - name: Commit and push
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SHORT_SHA="${HEAD_SHA:0:7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No image tag changes to commit"
            exit 0
          fi

          git add infra/k8s/overlays/dev/
          git commit -m "chore(infra): update dev image tags to ${SHORT_SHA} [skip ci]"
          git push

  smoke-test:
    needs: update-dev-images
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Wait for gateway to be ready
        env:
          BASE_URL: ${{ vars.SMOKE_TEST_BASE_URL }}
        run: |
          : "${BASE_URL:?SMOKE_TEST_BASE_URL Repository Variable이 필요합니다}"
          echo "ArgoCD sync + rollout 대기 (최대 5분)..."
          for i in $(seq 1 30); do
            if curl -sf --connect-timeout 3 --max-time 5 "${BASE_URL}/actuator/health" | grep -qE '"status"[[:space:]]*:[[:space:]]*"UP"'; then
              echo "Gateway ready (attempt ${i})"
              exit 0
            fi
            echo "  대기 중... ${i}/30"
            sleep 10
          done
          echo "Gateway가 5분 내에 응답하지 않았습니다"
          exit 1

      - name: Run smoke tests
        env:
          BASE_URL: ${{ vars.SMOKE_TEST_BASE_URL }}
        run: |
          chmod +x e2e/smoke.sh
          e2e/smoke.sh
