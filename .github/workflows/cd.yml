name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  GCP_REGION: asia-northeast3
  AR_REPO: auction-images

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  update-and-deploy:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530
        with:
          kustomize-version: "5.8.1"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Verify images exist in Artifact Registry
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SHORT_SHA="${HEAD_SHA:0:7}"
          REGISTRY="${GCP_REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${AR_REPO}"
          MISSING=()

          for svc in api-gateway auction-service bid-service user-service notification-service auction-streams; do
            if ! gcloud artifacts docker images describe "${REGISTRY}/${svc}:${SHORT_SHA}" --quiet 2>/dev/null; then
              MISSING+=("${svc}:${SHORT_SHA}")
            fi
          done

          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "이미지 푸시가 확인되지 않은 서비스가 있습니다. 배포를 중단합니다."
            echo "누락 이미지: ${MISSING[*]}"
            exit 1
          fi
          echo "모든 이미지 확인 완료: ${SHORT_SHA}"

      - name: Update dev overlay image tags
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SHORT_SHA="${HEAD_SHA:0:7}"
          REGISTRY="${GCP_REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${AR_REPO}"

          for svc in api-gateway auction-service bid-service user-service notification-service auction-streams; do
            (cd "infra/k8s/overlays/dev/${svc}" && \
              kustomize edit set image "${svc}=${REGISTRY}/${svc}:${SHORT_SHA}")
          done

          echo "Updated image tags to ${SHORT_SHA}"

      - name: Commit and push image tag update
        id: deploy-revision
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SHORT_SHA="${HEAD_SHA:0:7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No image tag changes to commit"
          else
            git add infra/k8s/overlays/dev/
            git commit -m "chore(infra): update dev image tags to ${SHORT_SHA} [skip ci]"
            git pull --rebase
            git push
          fi

          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure kubectl for GKE
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395  # v3.0.0
        with:
          cluster_name: auction-cluster
          location: ${{ env.GCP_REGION }}-a
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Wait for ArgoCD applications
        env:
          ARGOCD_REVISION: ${{ steps.deploy-revision.outputs.revision }}
        run: |
          chmod +x .github/scripts/wait-for-argocd-apps.sh
          .github/scripts/wait-for-argocd-apps.sh


  smoke-test:
    needs: update-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Wait for gateway to be ready
        env:
          BASE_URL: ${{ vars.SMOKE_TEST_BASE_URL }}
        run: |
          : "${BASE_URL:?SMOKE_TEST_BASE_URL Repository Variable이 필요합니다}"
          echo "Gateway 응답 대기 (최대 5분)..."
          for i in $(seq 1 30); do
            if curl -sf --connect-timeout 3 --max-time 5 "${BASE_URL}/actuator/health" | grep -qE '"status"[[:space:]]*:[[:space:]]*"UP"'; then
              echo "Gateway ready (attempt ${i})"
              exit 0
            fi
            echo "  대기 중... ${i}/30"
            sleep 10
          done
          echo "Gateway가 5분 내에 응답하지 않았습니다"
          exit 1

      - name: Run smoke tests
        env:
          BASE_URL: ${{ vars.SMOKE_TEST_BASE_URL }}
        run: |
          chmod +x e2e/smoke.sh
          e2e/smoke.sh
