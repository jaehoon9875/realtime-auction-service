language: "ko-KR"

reviews:
  profile: chill
  request_changes_workflow: true   # 문제 발견 시 Request Changes 상태로 전환
  high_level_summary: true         # PR 상단에 요약 댓글 게시
  poem: false
  review_status: true
  collapse_walkthrough: false

  path_filters:
    - "!**/build/**"
    - "!**/generated/**"
    - "!**/*.class"
    - "!**/.gradle/**"
    - "!**/gradlew"

  path_instructions:
    - path: "services/**/src/main/**/*.java"
      instructions: |
        다음 프로젝트 고유 규칙을 기준으로 리뷰:
        - Kafka 직접 발행 금지: 반드시 Outbox Table 저장 → Debezium 경로로만 발행
        - 서비스 간 DB 직접 참조 금지: 데이터 공유는 Kafka 이벤트로만 처리
        - 외부 서비스 호출에 Resilience4j Circuit Breaker / Retry 적용
        - 환경변수 하드코딩 금지: @ConfigurationProperties 또는 application.yml 사용
        - 시크릿(API 키, 비밀번호, JWT secret) 하드코딩 절대 금지
        - @Transactional 범위가 불필요하게 넓지 않은지 확인 (Outbox 저장이 트랜잭션 내에 포함되어 있는지 확인)

    - path: "services/**/src/test/**/*.java"
      instructions: |
        테스트 코드 리뷰 기준:
        - 통합 테스트는 반드시 Testcontainers 사용 (Mock DB 금지)
        - 테스트 메서드에 시나리오 의도가 한글로 명시되어 있는지 확인
        - Mock 남용 여부 확인: 외부 서비스 경계에서만 Mock 허용

    - path: "services/notification-service/src/main/**/*.java"
      instructions: |
        Notification Service (WebSocket) 리뷰 기준:
        - WebSocket 연결 관리 시 메모리 누수 가능성 확인 (연결 해제 시 리소스 정리 여부)
        - 알림 이벤트 수신은 반드시 Kafka Consumer를 통해서만 처리 (직접 DB 폴링 금지)
        - WebSocket 세션 상태는 서버 메모리에만 저장 (DB 직접 저장 금지)

    - path: "streams/**/*.java"
      instructions: |
        Kafka Streams 코드 리뷰 기준:
        - State Store 접근 시 thread-safety 확인
        - 토폴로지 변경 시 State Store 호환성 영향도 확인
        - 경매 최고가 상태는 State Store에서만 관리 (DB 직접 접근 금지)
        - 이벤트 스키마 변경 시 Confluent Schema Registry 호환성 확인 (Avro)
        - 예외 처리: DeserializationExceptionHandler, ProductionExceptionHandler 구현 여부 확인

    - path: "infra/k8s/**"
      instructions: |
        ArgoCD 자동 배포 대상이므로 변경 시 영향도를 반드시 확인.
        시크릿은 Secret 리소스로 분리되어 있는지 확인.
        ConfigMap/Secret 변경 시 관련 Deployment의 롤링 업데이트 트리거 여부 확인.

    - path: "infra/helm/**"
      instructions: |
        Helm 차트 변경 시 영향 범위 확인:
        - values.yaml의 민감 값(비밀번호, 키)이 하드코딩되어 있지 않은지 확인
        - 모니터링 스택(Prometheus, Grafana, Loki, Tempo) 변경 시 기존 대시보드·얼럿 영향도 확인

    - path: "infra/argocd/**"
      instructions: |
        ArgoCD 앱 정의 변경 시 주의사항:
        - syncPolicy 변경(특히 automated 활성화/비활성화)은 배포 동작에 즉각 영향
        - targetRevision 변경 시 배포 대상 브랜치/태그가 의도에 맞는지 확인

    - path: "infra/terraform/**"
      instructions: |
        - PR에 terraform plan 출력 결과가 첨부되어 있는지 확인
        - destroy 또는 replace 계획이 포함된 경우 명시적으로 지적
        - GKE node pool, VPC 변경은 운영 중단 가능성을 경고
        - 민감 변수(passwords, keys)가 tfvars에 하드코딩되어 있지 않은지 확인

chat:
  auto_reply: true  # PR 댓글로 CodeRabbit에 질문 가능
